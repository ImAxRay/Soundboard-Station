            border-radius: 4px;
        }

            background: #6366f1;
        }
        
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            position: relative;
        }
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            transition: transform 0.3s ease;

            animation: marquee-scroll 7s linear infinite;
        }

        @keyframes marquee-scroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }

            background: rgba(26, 29, 38, 0.88);

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake {

        const createSynthAudioBuffer = (audioCtx, type) => {
            const sampleRate = audioCtx.sampleRate;
            let duration = 1.0;
            let buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);

            if (type === 'airhorn') {
                duration = 0.8;
                buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    const freq = 280 + Math.sin(t * 40) * 15;
                    data[i] = (Math.sin(2 * Math.PI * freq * t) > 0 ? 0.3 : -0.3) * (1 - t / duration);
                }
            } else if (type === 'pew') {
                duration = 0.4;
                buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    const freq = 800 * Math.exp(-t * 12);
                    data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration);
                }
            } else if (type === 'chime') {
                duration = 1.5;
                buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    const freq = 523.25;
                    data[i] = (Math.sin(2 * Math.PI * freq * t) + 0.5 * Math.sin(2 * Math.PI * freq * 2 * t)) * Math.exp(-t * 3);
                }
            } else if (type === 'quack') {
                duration = 0.5;
                buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    const freq = 180 + Math.sin(t * 80) * 40;
                    data[i] = (Math.sin(2 * Math.PI * freq * t) + (Math.random() - 0.5) * 0.2) * (1 - t / duration);
                }
            } else if (type === 'victory') {
                duration = 2.0;
                buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    let freq = 440;
                    if (t > 0.3) freq = 554.37;
                    if (t > 0.6) freq = 659.25;
                    if (t > 1.0) freq = 880;
                    data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-(t % 0.3) * 2) * (1 - t / duration);
                }
            } else if (type === 'test_long') {
                duration = 3.5;
                buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    const freq = 300 + Math.sin(t * 10) * 150;
                    data[i] = Math.sin(2 * Math.PI * freq * t) * 0.2 * (1 - t / duration);
                }
            } else {
                duration = 0.6;
                buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    const freq = t < 0.15 ? 987.77 : 1318.51;
                    data[i] = Math.sin(2 * Math.PI * freq * t) * (1 - t / duration);
                }
            }
            return buffer;
        };

        const generateHighResPeaks = (audioBuffer, numBars = 180) => {
            if (!audioBuffer) return new Array(numBars).fill(0.12);
            const rawData = audioBuffer.getChannelData(0);
            const samplesPerBar = Math.floor(rawData.length / numBars);
            const peaks = [];

            for (let i = 0; i < numBars; i++) {
                const start = i * samplesPerBar;
                let max = 0;
                for (let j = 0; j < samplesPerBar; j++) {
                    const val = Math.abs(rawData[start + j] || 0);
                    if (val > max) max = val;
                }
                const clampedBar = Math.max(0.12, max);
                peaks.push(clampedBar);
            }
            return peaks;
        };

        const sliderToLogSpeed = (val) => {
            const minp = 0;
            const maxp = 100;
            const minv = Math.log(0.5);
            const maxv = Math.log(500);
            const scale = (maxv - minv) / (maxp - minp);
            return Math.exp(minv + scale * (val - minp));
        };

            const [sounds, setSounds] = useState([
                { id: '1', name: 'Airhorn Blaster.mp3', folder: 'Memes', keybind: '', mode: 'overlap', buffer: null, type: 'airhorn', duration: 0.8, pitchCents: 0, image: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80' },

            ]);

            const activeInstancesRef = useRef([]);
            const pausedStatesRef = useRef({});
            const [activeInstanceCount, setActiveInstanceCount] = useState(0);

            const [isScrubbing, setIsScrubbing] = useState(false);

            const pitchDragStartRef = useRef({ startX: 0, initialPitchCents: 0 });

            const [recentSound, setRecentSound] = useState(null);

            const globalSpanRef = useRef({ totalSpan: 0, maxEndTime: 0, remaining: 0, active: false });
            const [mainTimelineState, setMainTimelineState] = useState({ totalSpan: 0, remaining: 0, active: false });

            const [listeningTarget, setListeningTarget] = useState(null);
            const [listeningPreview, setListeningPreview] = useState('');
            const activeKeysRef = useRef(new Set());
            const listenerComboRef = useRef('');
            const listenerActionRef = useRef(null);
            
            const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, soundId: null });
            const fileInputRef = useRef(null);

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.folders) setFolders(parsed.folders);
                        if (parsed.globalPitchCents !== undefined) setGlobalPitchCents(parsed.globalPitchCents);
                        if (parsed.randomPitchEnabled !== undefined) setRandomPitchEnabled(parsed.randomPitchEnabled);

                        if (parsed.multiAssignedSoundIds) setMultiAssignedSoundIds(parsed.multiAssignedSoundIds);
                        if (parsed.killKeybind !== undefined) setKillKeybind(parsed.killKeybind);
                        if (parsed.sounds) {

            }, []);

            useEffect(() => {
                const config = {
                    folders,
                    globalPitchCents,
                    randomPitchEnabled,
                    randomPitchRangeCents,
                    vibratoEnabled,
                    vibratoSpeedSlider,
                    vibratoAmplitudeCents,
                    limiterReleaseMs,
                    chaosCount,
                    chaosKeybind,
                    multiSoundKeybind,
                    multiSoundMode,

                                                    : 'text-emerald-300'
                                            }`}
                                            title={"Explanation: Assigns global Chaos Burst hotkey.\nKeybind: " + (chaosKeybind || 'None') + "\nAdditional Controls: Click to assign | Ctrl + Right Click to clear."}
                                        >
                                            {listeningTarget?.type === 'chaos' ? (listeningPreview || 'Press key...') : (chaosKeybind || 'None')}
                                        </button>
                                        <button onClick={cancelKeybindAssignment} disabled={!chaosActive} className="p-1 hover:bg-winHover text-winTextMuted border-l border-winBorder" title={"Explanation: Reverts keybind assignment.\nKeybind: Shift + Backspace\nAdditional Controls: Click to undo."}>
                                            <Icon name="undo" className="w-3 h-3" />
                                        </button>
                                        <button onClick={() => setChaosKeybind('')} disabled={!chaosActive} className="p-1 hover:bg-rose-500/20 text-rose-400 border-l border-winBorder" title={"Explanation: Clears Chaos hotkey.\nKeybind: Shift + Delete\nAdditional Controls: Click to clear."}>
                                            <Icon name="x" className="w-3 h-3" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 overflow-y-auto pr-1 min-h-0">
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3.5 pb-4">
                            {(activeFolder === 'All' ? sounds : sounds.filter(s => s.folder === activeFolder))
                                .filter(s => !showOnlyMultiAssigned || multiAssignedSoundIds.includes(s.id))
                                .map(sound => {
                                const isPlaying = activeInstancesRef.current.some(inst => inst.soundId === sound.id);
                                const isMultiSelected = selectedSoundIdsForMulti.includes(sound.id);
                                const isMultiAssigned = multiAssignedSoundIds.includes(sound.id);

                                return (
                                    <div 
                                        key={sound.id}
                                        className={`win-glass p-2.5 rounded-2xl border transition-all flex flex-col items-center group shadow-md relative ${
                                            isPlaying ? 'border-emerald-400 bg-emerald-950/40 shadow-lg shadow-emerald-500/20' : isMultiSelected ? 'border-amber-400 bg-amber-950/40' : selectedSoundId === sound.id ? 'border-winAccent bg-winCard/80' : 'border-winBorder/80 hover:border-winAccent/50'
                                        }`}
                                        onClick={(e) => {
                                            if (isSelectionMode) {
                                                e.stopPropagation();
                                                setSelectedSoundIdsForMulti(prev => isMultiSelected ? prev.filter(id => id !== sound.id) : [...prev, sound.id]);
                                                return;
                                            }
                                            setSelectedSoundId(sound.id);
                                        }}
                                        onContextMenu={(e) => {
                                            e.preventDefault();
                                            setSelectedSoundId(sound.id);
                                            setContextMenu({ visible: true, x: e.clientX, y: e.clientY, soundId: sound.id });
                                        }}
                                        title={"Explanation: Sound card item container for " + sound.name + ".\nKeybind: " + (sound.keybind || 'None') + "\nAdditional Controls: Click to select, right-click for context menu, or press assigned keybind."}
                                    >
                                        {isMultiAssigned && <div className="absolute top-1 left-1 z-20 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-black" title="Assigned to multi-sound trigger list"></div>}

                                        <div
                                            onPointerDown={(e) => {
                                                if (e.button !== 0) return;
                                                if (e.altKey) { e.preventDefault(); e.stopPropagation(); setSounds(prev => prev.map(s => s.id === sound.id ? { ...s, pitchCents: 0 } : s)); return; }
                                                if (e.ctrlKey) {
                                                    e.preventDefault(); e.stopPropagation();
                                                    e.currentTarget.setPointerCapture(e.pointerId);
                                                    setPitchDragTarget(sound.id);
                                                    pitchDragStartRef.current = { startX: e.clientX, initialPitchCents: sound.pitchCents || 0 };
                                                    return;
                                                }
                                                e.preventDefault();
                                                playSound(sound.id);
                                            }}
                                            onPointerMove={(e) => {
                                                if (pitchDragTarget === sound.id) {
                                                    e.preventDefault();
                                                    const deltaX = e.clientX - pitchDragStartRef.current.startX;
                                                    const newPitch = Math.max(-2400, Math.min(2400, pitchDragStartRef.current.initialPitchCents + Math.round((deltaX / 300) * 4800)));
                                                    setSounds(prev => prev.map(s => s.id === sound.id ? { ...s, pitchCents: newPitch } : s));
                                                }
                                            }}
                                            onPointerUp={(e) => {
                                                if (pitchDragTarget === sound.id) {
                                                    e.preventDefault();
                                                    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch(err){}
                                                    setPitchDragTarget(null);
                                                } else if (sound.mode === 'hold_loop') stopHoldInstance(sound.id);
                                            }}
                                            onPointerLeave={(e) => { if (sound.mode === 'hold_loop' && pitchDragTarget !== sound.id) stopHoldInstance(sound.id); }}
                                            className={`w-full aspect-square rounded-xl relative overflow-hidden mb-2 border cursor-pointer transition-all ${isPlaying ? 'border-emerald-400 shadow-lg shadow-emerald-500/30' : 'border-winBorder/70 hover:border-winAccent/60'}`}
                                            title={"Explanation: Sound playback button & waveform display.\nKeybind: " + (sound.keybind || 'None') + "\nAdditional Controls: Left Click to play | Ctrl + Drag to pitch bend | Alt + Click to reset pitch."}
                                        >
                                            <img src={sound.image} alt={sound.name} className={`w-full h-full object-cover transition-transform duration-300 group-hover:scale-105 ${sound.pitchCents !== 0 ? 'brightness-50' : ''}`} onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80'; }} />
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-black/40"></div>
                                            {sound.pitchCents !== 0 && <div className="absolute left-0 top-0 bottom-0 bg-indigo-600/60 border-r-2 border-indigo-300 transition-all pointer-events-none" style={{ width: `${Math.max(0, Math.min(100, ((sound.pitchCents + 2400) / 4800) * 100))}%` }}></div>}
                                            <span className="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded text-[9px] uppercase font-mono font-bold bg-black/70 backdrop-blur-md text-indigo-300 border border-indigo-500/30 shadow-md">
                                                {sound.mode === 'play_pause' ? 'P/P' : sound.mode === 'hold_loop' ? 'HOLD' : sound.mode === 'stop' ? 'STOP' : 'OVL'}
                                            </span>
                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                {sound.pitchCents !== 0 ? (
                                                    <span className="font-mono font-extrabold text-lg text-white drop-shadow-md bg-black/60 px-2 py-0.5 rounded-lg border border-white/20">
                                                        {sound.pitchCents > 0 ? `+${sound.pitchCents}` : sound.pitchCents} ct
                                                    </span>
                                                ) : (
                                                    <div className={`p-2.5 rounded-full transition-all ${isPlaying ? 'bg-emerald-500 text-black animate-pulse scale-110 shadow-lg shadow-emerald-500/50' : 'bg-black/50 backdrop-blur-md text-white border border-white/20 opacity-80 group-hover:opacity-100 group-hover:scale-110'}`}>
                                                        <Icon name={isPlaying ? "volume-2" : "play"} className="w-5 h-5" />
                                                    </div>
                                                )}
                                            </div>
                                            <div className="absolute bottom-1.5 right-1.5 px-1.5 py-0.5 rounded-md bg-black/80 backdrop-blur-md border border-white/10 text-[10px] font-mono font-semibold text-slate-100 shadow-md">
                                                {sound.duration.toFixed(1)}s
                                            </div>
                                        </div>

                                        <div className="w-full flex items-center bg-winCard rounded-lg border border-winBorder overflow-hidden mb-1.5">
                                            <button
                                                onClick={(e) => { e.stopPropagation(); setListeningTarget({ type: 'sound', id: sound.id, initialKeybind: sound.keybind }); }}
                                                onContextMenu={(e) => { if (e.ctrlKey) { e.preventDefault(); e.stopPropagation(); setSounds(prev => prev.map(s => s.id === sound.id ? { ...s, keybind: '' } : s)); } }}
                                                className={`flex-1 py-1 px-1.5 text-xs font-mono font-semibold transition-all text-center truncate ${
                                                    listeningTarget?.id === sound.id
                                                        ? (listeningPreview === 'Occupied' ? 'bg-rose-600 text-white animate-shake' : 'bg-emerald-600 text-white font-bold animate-pulse')
                                                        : sound.keybind ? 'text-indigo-300' : 'text-winTextMuted'
                                                }`}
                                                title={"Explanation: Assigns global hotkey for playing " + sound.name + ".\nKeybind: " + (sound.keybind || 'None') + "\nAdditional Controls: Click to assign | Shift+Backspace to cancel | Shift+Delete or Ctrl+Right Click to clear."}
                                            >
                                                {listeningTarget?.id === sound.id ? (listeningPreview || 'Press key...') : (sound.keybind || 'None')}
                                            </button>
                                            <button onClick={(e) => { e.stopPropagation(); cancelKeybindAssignment(); }} className="p-1 hover:bg-winHover text-winTextMuted border-l border-winBorder" title={"Explanation: Reverts keybind change.\nKeybind: Shift + Backspace\nAdditional Controls: Click to undo assignment."}>
                                                <Icon name="undo" className="w-3 h-3" />
                                            </button>
                                            <button onClick={(e) => { e.stopPropagation(); setSounds(prev => prev.map(s => s.id === sound.id ? { ...s, keybind: '' } : s)); }} className="p-1 hover:bg-rose-500/20 text-rose-400 border-l border-winBorder" title={"Explanation: Clears sound keybind.\nKeybind: Shift + Delete\nAdditional Controls: Click to clear."}>
                                                <Icon name="x" className="w-3 h-3" />
                                            </button>
                                        </div>

                                        <div className="w-full marquee-container text-center">
                                            <div className="marquee-content text-xs text-winTextMuted group-hover:text-winText transition-colors font-medium cursor-default">
                                                <span className="px-2">{sound.name}</span>
                                                <span className="px-2">{sound.name}</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {contextMenu.visible && (
                        <div className="fixed z-50 win-glass rounded-xl border border-winBorder shadow-2xl py-1.5 w-52 text-xs text-winText" style={{ top: `${contextMenu.y}px`, left: `${contextMenu.x}px` }}>
                            <div className="px-3 py-1 text-[10px] font-semibold text-winTextMuted uppercase tracking-wider border-b border-winBorder/50">Play Trigger Mode</div>
                            {[
                                { id: 'overlap', label: 'Overlap (Stack Playback)' },
                                { id: 'play_pause', label: 'Play / Pause (Pause & Resume)' },
                                { id: 'stop', label: 'Stop & Reset on 2nd Trigger' },
                                { id: 'hold_loop', label: 'Hold / Loop (0-Delay)' }
                            ].map(m => {
                                const currentSound = sounds.find(s => s.id === contextMenu.soundId);
                                const isActive = currentSound?.mode === m.id;
                                return (
                                    <button
                                        key={m.id}
                                        onClick={() => { setSounds(prev => prev.map(s => s.id === contextMenu.soundId ? { ...s, mode: m.id } : s)); setContextMenu({ ...contextMenu, visible: false }); }}
                                        className={`w-full text-left px-3 py-1.5 flex items-center justify-between hover:bg-winHover transition-colors ${isActive ? 'text-winAccent font-semibold' : 'text-winText'}`}
                                        title={`Explanation: Sets trigger playback mode to ${m.label}.\nKeybind: None\nAdditional Controls: Click to select mode.`}
                                    >
                                        <span>{m.label}</span>
                                        {isActive && <Icon name="check" className="w-3.5 h-3.5 text-winAccent" />}
                                    </button>
                                );
                            })}
                            <div className="border-t border-winBorder/50 my-1"></div>
                            <button onClick={() => { const s = sounds.find(x => x.id === contextMenu.soundId); setListeningTarget({ type: 'sound', id: contextMenu.soundId, initialKeybind: s?.keybind }); setContextMenu({ ...contextMenu, visible: false }); }} className="w-full text-left px-3 py-1.5 hover:bg-winHover flex items-center gap-2 text-winText" title="Explanation: Changes keybind assignment for this sound.\nKeybind: None\nAdditional Controls: Click to enter assignment mode.">
                                <Icon name="keyboard" className="w-3.5 h-3.5 text-winAccent" />
                                <span>Change Keybind</span>
                            </button>
                            <button onClick={() => { setSounds(prev => prev.filter(s => s.id !== contextMenu.soundId)); setContextMenu({ ...contextMenu, visible: false }); }} className="w-full text-left px-3 py-1.5 hover:bg-rose-500/20 text-rose-400 flex items-center gap-2" title="Explanation: Deletes this sound card from library.\nKeybind: None\nAdditional Controls: Click to delete permanently.">
                                <Icon name="trash-2" className="w-3.5 h-3.5" />
                                <span>Delete Sound</span>
                            </button>
                        </div>
                    )}

                    {showDiscordModal && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="win-glass max-w-lg w-full rounded-2xl border border-winBorder p-6 shadow-2xl relative text-xs" title="Explanation: Discord & Virtual Audio Device Setup Modal.\nKeybind: None\nAdditional Controls: Configure input/output devices.">
                                <button onClick={() => setShowDiscordModal(false)} className="absolute top-4 right-4 text-winTextMuted hover:text-white" title="Explanation: Close modal.\nKeybind: Esc\nAdditional Controls: Click to close.">
                                    <Icon name="x" className="w-5 h-5" />
                                </button>
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="p-2.5 rounded-xl bg-indigo-500/20 border border-indigo-500/40 text-indigo-400">
                                        <Icon name="mic" className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h3 className="text-base font-bold text-white">Discord & Audio Device Setup</h3>
                                        <p className="text-winTextMuted">Stream soundboard audio into Discord while monitoring on speakers</p>
                                    </div>
                                </div>
                                <div className="space-y-3 text-winText text-xs leading-relaxed">
                                    <div className="bg-winCard p-3 rounded-xl border border-winBorder">
                                        <p className="font-semibold text-indigo-300 mb-1">Step 1: Install VB-Audio Cable</p>
                                        <p className="text-winTextMuted">Download and install the free VB-Audio Virtual Cable driver on Windows 11.</p>
                                    </div>
                                    <div className="bg-winCard p-3 rounded-xl border border-winBorder">
                                        <p className="font-semibold text-indigo-300 mb-1">Step 2: Discord Input Device</p>
                                        <p className="text-winTextMuted">In Discord under <b>Voice & Video</b> settings, set your <b>Input Device</b> to <i>CABLE Output (VB-Audio Virtual Cable)</i>.</p>
                                    </div>
                                </div>
                                <div className="mt-6 flex justify-end">
                                    <button onClick={() => setShowDiscordModal(false)} className="px-4 py-2 rounded-xl bg-winAccent hover:bg-winAccentHover text-white font-semibold" title="Explanation: Close setup modal.\nKeybind: Enter / Click\nAdditional Controls: Click to dismiss.">
                                        Got It, Ready!
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
